function zeros(y){let sum=0;return times.map(t=>{let c=interp(t,T,y)/200,d=(1-c*sum)/(1+c);sum+=d;return -Math.log(d)/t})}
function portfolio(){let q=D.y[S.i],z=zeros(q),v=S.bp,mode=S.scenario;let shock=T.map(t=>mode==='Steepener'?v*(2*(t-1)/29-1):mode==='Belly shock'?interp(t,[1,5,30],[0,v,0]):mode==='October 2023 replay'?(D.y[D.dates.indexOf('2023-10-20')][T.indexOf(t)]-D.y[D.dates.indexOf('2023-10-16')][T.indexOf(t)])*100:0);let after=mode==='Parallel zero'?z.map(s=>s+v/10000):zeros(q.map((s,j)=>s+shock[j]/100));let rows=ten.map((term,j)=>{let pv=0,pnl=0,dur=0,conv=0,dv=0;times.forEach((t,k)=>{if(t>term)return;let cf=S.hold[j]*1e6*(coupon[j]/2+(t===term?1:0)),p=cf*Math.exp(-t*z[k]);pv+=p;pnl+=cf*Math.exp(-t*after[k])-p;dur+=p*t;conv+=p*t*t;dv+=p*Math.sinh(t/10000)});return{pv,pnl,dur,conv,dv}});return{z,after,rows,sum:k=>rows.reduce((a,b)=>a+b[k],0)}}
function risk(){let p=portfolio(),pv=p.sum('pv');stats([['Portfolio value',money(pv)],['Scenario P&L',money(p.sum('pnl'))],['DV01',money(p.sum('dv'))],['Duration',pv?num(p.sum('dur')/pv,2)+' yr':'—']]);let data=[['Bond','Coupon','Value','DV01','Stress P&L'],...p.rows.map((r,i)=>[ten[i]+'Y',num(coupon[i]*100,1)+'%',money(r.pv),money(r.dv),money(r.pnl)])];csv=data;return '<div class="head"><h2>Base and stressed zero curves</h2><small>Annual zero rate (%)</small></div>'+fig([{name:'Base curve',x:times,y:p.z.map(v=>v*100)},{name:'Stressed curve',x:times,y:p.after.map(v=>v*100)}],[[.5,'6M'],[5,'5Y'],[10,'10Y'],[20,'20Y'],[30,'30Y']],'Zero rates, percent')+'<h3>Position contributions</h3>'+table(data)+'<p class="note">Convexity: '+(pv?num(p.sum('conv')/pv,2)+' yr²':'—')+'. '+(S.scenario==='Parallel zero'?'Duration–convexity P&L estimate: '+money(-p.sum('dur')*S.bp/10000+.5*p.sum('conv')*(S.bp/10000)**2)+'.':'Par yields are shocked first, then discount factors are rebuilt.')+'</p>'}
function fitted(model,t){let b=D[model][S.i],ds=D.validation.find(r=>r.model===model&&r.test==='All maturities');let x=t*ds.decay_1,a=-Math.expm1(-x)/x;let v=b[0]+a*b[1]+(a-Math.exp(-x))*b[2];if(model==='NSS'){x=t*ds.decay_2;v+=b[3]*(-Math.expm1(-x)/x-Math.exp(-x))}return v}
function curve(){let Y=D.y[S.i],models=S.model==='NS + NSS'?['NS','NSS']:[S.model],err=m=>Math.sqrt(T.reduce((a,t,i)=>a+(100*(fitted(m,t)-Y[i]))**2,0)/8);stats([['2-year yield',num(Y[1],2)+'%'],['10Y − 2Y',num(100*(Y[5]-Y[1]))+' bp'],['NS RMSE · date',num(err('NS'),2)+' bp'],['NSS RMSE · date',num(err('NSS'),2)+' bp']]);const g=Array.from({length:117},(_,i)=>1+i/4),res=S.mode==='Residuals';let ss=res?[]:[{name:'Published',x:T,y:Y}];models.forEach(m=>ss.push({name:m,x:res?T:g,y:res?T.map((t,i)=>100*(fitted(m,t)-Y[i])):g.map(t=>fitted(m,t))}));let d=[['2024 model','All-maturity RMSE','Withheld 7Y RMSE'],...['NS','NSS','Linear'].map(m=>[m,...['All maturities','Unseen 7Y'].map(s=>{let a=D.validation.find(v=>v.model===m&&v.test===s);return a?num(a.RMSE_bp,2)+' bp':'—'})])];csv=[['Tenor','Observed (%)',...models.map(m=>m+' (%)')],...T.map((t,i)=>[t+'Y',Y[i],...models.map(m=>fitted(m,t).toFixed(5))])];return '<div class="head"><h2>'+ (res?'Fitted minus observed':'Yield by maturity')+'</h2><small>'+(res?'Basis points':'Annual par yield (%)')+'</small></div>'+fig(ss,labels,'Curve comparison')+'<h3>Validation across 2024</h3>'+table(d)+'<p class="note">Decay parameters use 2023 calibration. The 7-year test withholds that maturity throughout calibration and evaluation.</p>'}
function tickdates(x){return [...new Set([0,Math.floor((x.length-1)/2),x.length-1])].map(k=>[k,x[k].slice(5)])}
function forecast(){const f=D.fc[S.h],offset=f['DNS VAR'].offset,j=S.m,ix=S.i-offset,from=Math.max(0,ix-59),xs=Array.from({length:ix-from+1},(_,k)=>k),dates=xs.map(k=>dt(offset+from+k));let act=D.y[S.i][j],hat=f['DNS VAR'].values[ix][j],last=f['Last observed'].values[ix][j];stats([['Target yield',num(act,2)+'%'],['DNS–VAR forecast',num(hat,2)+'%'],['Forecast error',num((hat-act)*100,1)+' bp'],['Forecast origin',dt(S.i-S.h)]]);let ss=['Observed','DNS VAR','Last observed'].map(name=>({name,x:xs,y:xs.map(k=>name==='Observed'?D.y[offset+from+k][j]:f[name].values[from+k][j])}));let d=[['Forecast','RMSE (bp)','MAE (bp)','Targets'],...Object.keys(f).map(name=>{let es=f[name].values.map((row,k)=>100*(row[j]-D.y[offset+k][j]));return [name,num(Math.sqrt(es.reduce((a,b)=>a+b*b,0)/es.length),2),num(es.reduce((a,b)=>a+Math.abs(b),0)/es.length,2),es.length]})];csv=[['Target','Actual yield','DNS VAR','Last observed'],...xs.map(k=>[dates[k],...ss.map(s=>s.y[k])])];return '<h2>'+T[j]+'-year yield forecasts</h2><p class="note">Up to 60 targets ending '+dt(S.i)+' · annual yields (%)</p>'+fig(ss,tickdates(dates),'Forecast versus actual')+'<h3>Full test-period scores · '+S.h+' trading days ahead</h3>'+table(d)+'<p class="note">Each forecast uses data through its origin. “Last observed” carries the latest published quote forward.</p>'}
function pca(){let idx=S.i-250,r=D.rolling[idx],first=Math.max(0,idx-S.look+1),rr=D.rolling.slice(first,idx+1),xs=rr.map((_,i)=>i);stats([['Broad shift similarity',num(r[1],3)],['Tilt similarity',num(r[2],3)],['Third direction',num(r[3],3)],['Subspace angle',num(r[7],1)+'°']]);let ss=['Broad shift','Tilt','Third direction'].map((name,i)=>({name,x:xs,y:rr.map(v=>v[i+1])}));let d=[['Matched component','Similarity','Variance share'],...ss.map((s,i)=>[s.name,num(r[i+1],3),num(100*r[i+4],2)+'%'])];csv=[['Date','Broad shift','Tilt','Third direction'],...rr.map(v=>v.slice(0,4))];return '<h2>Stability of factor directions</h2><p class="note">Absolute cosine similarity to the 2023 reference · 1 means aligned</p>'+fig(ss,tickdates(rr.map(v=>v[0])),'Rolling PCA similarity')+'<h3>Selected window ending '+r[0]+'</h3>'+table(d)+'<p class="note">Each estimate uses 63 daily changes. The history control changes the number of estimates displayed.</p>'}
function draw(){el('body').innerHTML=({risk,curve,forecast,pca})[S.tab]();let read=el('read');if(read)read.textContent=S.bp+' bp'}
function bind(id,fn){const e=el(id);if(e)e.onchange=fn}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===S.tab));let min=S.tab==='pca'?250:S.tab==='forecast'?D.fc[S.h]['DNS VAR'].offset:0;S.i=Math.max(min,S.i);el('date').innerHTML=D.dates.slice(min).map((v,k)=>option(k+min,v,S.i)).reverse().join('');let h='<h3>'+({risk:'Scenario controls',curve:'Curve settings',forecast:'Forecast settings',pca:'Window settings'})[S.tab]+'</h3>';if(S.tab==='risk'){let modes=['Parallel zero','Steepener','Belly shock','October 2023 replay'];h+=choices('scenario','Rate shock',modes,modes,S.scenario);if(S.scenario!=='October 2023 replay')h+='<label>Shock size · <output id="read"></output><input class="range" id="bp" type="range" min="-200" max="200" step="1" value="'+S.bp+'"></label>';h+='<p class="note">'+({'Parallel zero':'Shift every zero rate by the selected amount.','Steepener':'Short-end par yields move by the opposite of the slider; long-end yields move by its value.','Belly shock':'Peak par shock at 5Y, tapering to zero at 1Y and 30Y.','October 2023 replay':'Apply 16–20 October 2023 par-yield changes to the selected curve.'})[S.scenario]+'</p><h3 class="sep">Face value · USD millions</h3>'+ten.map((t,j)=>'<div class="hold"><label for="hold'+j+'">'+t+'-year bond</label><input type="number" step=".1" min="0" max="100" id="hold'+j+'" value="'+S.hold[j]+'"></div>').join('')+'<button class="action" id="reset">Reset portfolio</button>'}else if(S.tab==='curve'){h+=choices('model','Model',['NS + NSS','NS','NSS'],['Both models','Nelson–Siegel','Svensson'],S.model)+choices('mode','Display',['Fitted curve','Residuals'],['Fitted curves','Fitting errors'],S.mode)}else if(S.tab==='forecast'){h+=choices('hor','Forecast horizon',[1,5,20],['1 trading day','5 trading days','20 trading days'],S.h)+choices('tenor','Maturity',T.map((_,j)=>j),T.map(t=>t+' years'),S.m)}else h+=choices('look','History shown',[21,63,250],['21 estimates','63 estimates','Full evaluation period'],S.look);h+='<button id="csv" class="action">Download view CSV</button>';el('controls').innerHTML=h;
bind('date',e=>{S.i=+e.target.value;draw()});for(const [id,key,n] of [['scenario','scenario'],['model','model'],['mode','mode'],['hor','h',1],['tenor','m',1],['look','look',1]])bind(id,e=>{S[key]=n?+e.target.value:e.target.value;render()});if(el('bp'))el('bp').oninput=e=>{S.bp=+e.target.value;draw()};ten.forEach((_,j)=>{let e=el('hold'+j);if(!e)return;e.oninput=()=>{if(e.value!==''&&e.validity.valid){S.hold[j]=+e.value;draw()}};e.onchange=()=>{e.value=S.hold[j]}});if(el('reset'))el('reset').onclick=()=>{S.hold=[1,1,1,1];S.bp=100;S.scenario='Parallel zero';render()};el('csv').onclick=()=>{let blob=new Blob([csv.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=S.tab+'-'+dt(S.i)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)};draw()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});render();
</script></body></html>
