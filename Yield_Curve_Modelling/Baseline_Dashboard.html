function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));let h='';if(tab==='curve'){const r=D.rows[idx],f=terms.map(t=>fit(r,t)),spr=Math.round((r.y[5]-r.y[1])*100);const select='<div class="date"><label for="day">Observation</label><button id="prev" aria-label="Previous trading date" '+(!idx?'disabled':'')+'>‹</button><select id="day" aria-label="Trading date">'+D.rows.map((v,i)=>'<option value="'+i+'" '+(idx===i?'selected':'')+'>'+fmt(v.d)+'</option>').reverse().join('')+'</select><button id="next" aria-label="Next trading date" '+(idx===D.rows.length-1?'disabled':'')+'>›</button></div>';h+=header('Curve explorer',select)+metrics([['2-year yield',r.y[1].toFixed(2)+'%'],['10-year yield',r.y[5].toFixed(2)+'%'],['10Y − 2Y spread',signed(spr)+' bp']]);const ss=[{name:'Observed',color:blue,pts:points(r.y),dots:true},{name:'Nelson–Siegel fit',color:orange,dash:true,pts:Array.from({length:146},(_,i)=>[1+i/5,fit(r,1+i/5)])}];const err=r.y.map((v,i)=>(f[i]-v)*100),worst=err.map(Math.abs).indexOf(Math.max(...err.map(Math.abs)));h+='<div class="layout"><section class="chartbox"><h3>Yield by maturity</h3>'+legend(ss)+plot(ss,'Yield (%)')+'</section><aside class="side"><h3>Curve reading</h3><p>On '+fmt(r.d)+', the 10-year yield was '+(spr===0?'equal to the 2-year yield.':Math.abs(spr)+' basis points '+(spr>0?'above':'below')+' the 2-year yield.')+'</p><h3>Fit on this date</h3>'+table(['Measure','Value'],[['Mean absolute error',(err.reduce((a,b)=>a+Math.abs(b),0)/8).toFixed(2)+' bp'],['Largest deviation',terms[worst]+'Y'],['Fitted minus observed',signed(err[worst])+' bp']])+'</aside></div><section class="data"><h3>Maturity detail</h3>'+table(['Maturity',...terms.map(t=>t+'Y')],[['Observed (%)',...r.y.map(x=>x.toFixed(2))],['Fitted (%)',...f.map(x=>x.toFixed(2))],['Difference (bp)',...err.map(x=>x.toFixed(1))]])+'</section>'}
else if(tab==='model'){const ss=D.weights[0].map((_,i)=>({name:'PC'+(i+1),color:[blue,orange,green][i],pts:points(D.weights.map(r=>r[i])),dots:true}));h+=header('Model diagnostics')+metrics([['Curve fit · RMSE','5.47 bp'],['Withheld 7Y · model RMSE','2.91 bp'],['Withheld 7Y · linear RMSE','1.71 bp']])+'<div class="layout"><section><h3>Principal component weights</h3>'+legend(ss)+plot(ss,'Weight',true)+'</section><aside class="side"><h3>Variation in daily rate moves</h3>'+table(['Component','Share'],[['PC1 · broad shift','87.05%'],['PC2 · tilt','10.26%'],['PC3 · bend','1.58%']])+'<p>PCA uses 499 daily changes across eight maturities. The first three components explain 98.89% of sample variation.</p></aside></div><section class="data"><h3>Where the curve fit missed</h3>'+table(['Maturity',...terms.map(t=>t+'Y')],[['RMSE (bp)',...D.rmse.map(x=>x.toFixed(2))]])+'<p class="note">The 20-year maturity had the largest fitting error. When the entire 7-year series was withheld, straight-line interpolation between 5 and 10 years gave the lower error.</p></section>'}
else{const a=D.rows.find(r=>r.d==='2023-10-16'),b=D.rows.find(r=>r.d==='2023-10-20');const ss=[{name:'16 Oct 2023',color:blue,pts:points(a.y),dots:true},{name:'20 Oct 2023',color:orange,dash:true,pts:points(b.y),dots:true}];h+=header('Trading week','<span class="meta">16–20 October 2023</span>')+metrics([['Opening spread','−38 bp'],['Closing spread','−14 bp'],['Weekly steepening','+24 bp']])+'<div class="layout"><section><h3>Opening and closing curves</h3>'+legend(ss)+plot(ss,'Yield (%)')+'</section><aside class="side"><h3>What drove the move?</h3><p>The 10-year yield rose 22 bp while the 2-year yield fell 2 bp. The spread steepened by 24 bp and finished below zero.</p><h3>Selection</h3><p>This week had the largest absolute change in the 10Y − 2Y spread among 82 five-observation weeks.</p></aside></div><section class="data"><h3>Change by maturity</h3>'+table(['Maturity',...terms.map(t=>t+'Y')],[['Change (bp)',...a.y.map((v,i)=>signed((b.y[i]-v)*100))]])+'</section>'}document.getElementById('view').innerHTML=h;if(tab==='curve'){const update=(i,id)=>{idx=i;render();const el=document.getElementById(id);(el.disabled?document.getElementById('day'):el).focus()};document.getElementById('day').onchange=e=>update(+e.target.value,'day');document.getElementById('prev').onclick=()=>update(idx-1,'prev');document.getElementById('next').onclick=()=>update(idx+1,'next')}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
